<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>TurfIQ Live</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0e0f;
  --surface: #141517;
  --surface2: #1c1e21;
  --surface3: #242729;
  --border: #2a2d31;
  --gold: #c9a84c;
  --gold-light: #e8c870;
  --gold-dim: #7a6230;
  --green: #3dba7e;
  --red: #e05555;
  --blue: #4a9eff;
  --purple: #9b7ff0;
  --text: #e8e6e1;
  --text-muted: #7a7975;
  --text-dim: #4a4845;
  --nav-h: 64px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: 'Instrument Sans', sans-serif;
}

.shell {
  display: flex;
  flex-direction: column;
  height: 100%;
  height: 100dvh;
}

/* ── TOP BAR ── */
.topbar {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  height: 52px;
  background: rgba(13,14,15,0.97);
  border-bottom: 1px solid var(--border);
  position: relative;
  z-index: 50;
}

.logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 24px;
  letter-spacing: 3px;
  color: var(--gold);
  display: flex;
  align-items: center;
  gap: 8px;
}

.logo-dot {
  width: 7px; height: 7px;
  background: var(--green);
  border-radius: 50%;
  animation: pulse 2s ease-in-out infinite;
  flex-shrink: 0;
}

@keyframes pulse {
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.4;transform:scale(.65)}
}

.track-badge {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--gold);
  background: rgba(201,168,76,.1);
  border: 1px solid var(--gold-dim);
  padding: 3px 8px;
  border-radius: 2px;
  letter-spacing: .5px;
}

/* ── STATE FILTER STRIP ── */
.state-strip {
  flex-shrink: 0;
  display: flex;
  gap: 6px;
  padding: 8px 16px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  scrollbar-width: none;
}
.state-strip::-webkit-scrollbar { display:none; }
.state-btn {
  padding: 6px 12px;
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text-muted);
  font-size: 11px;
  font-weight: 600;
  border-radius: 4px;
  cursor: pointer;
  white-space: nowrap;
}
.state-btn.active {
  background: var(--gold);
  color: #0d0e0f;
  border-color: var(--gold);
}

/* ── LIVE RACE STRIP ── */
.race-strip {
  flex-shrink: 0;
  display: flex;
  gap: 8px;
  padding: 10px 16px;
  overflow-x: auto;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  scrollbar-width: none;
}
.race-strip::-webkit-scrollbar { display:none; }

.race-chip {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 6px 10px;
  border-radius: 6px;
  border: 1px solid var(--border);
  cursor: pointer;
  background: var(--surface2);
  min-width: 85px;
}
.race-chip.active {
  border-color: var(--gold);
  background: rgba(201,168,76,.08);
}
.rc-venue {
  font-size: 11px;
  font-weight: 600;
  color: var(--text);
  max-width: 75px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.rc-meta {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  color: var(--gold);
  margin-top: 1px;
}
.rc-time {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--text-muted);
  margin-top: 3px;
}

/* ── CONDITIONS ROW ── */
.cond-row {
  flex-shrink: 0;
  display: flex;
  overflow-x: auto;
  scrollbar-width: none;
  border-bottom: 1px solid var(--border);
}
.cond-row::-webkit-scrollbar { display:none; }
.cond-cell {
  flex-shrink: 0;
  padding: 8px 14px;
  border-right: 1px solid var(--border);
  min-width: 95px;
}
.cond-lbl {
  font-family: 'DM Mono', monospace;
  font-size: 8px;
  color: var(--text-dim);
  text-transform: uppercase;
}
.cond-val { font-size: 13px; font-weight: 600; margin-top: 1px;}
.cv-good { color: var(--green); }

/* ── SCROLL AREA ── */
.scroll-area {
  flex: 1;
  overflow-y: auto;
}

/* ── TAB BAR ── */
.tab-bar {
  display: flex;
  overflow-x: auto;
  scrollbar-width: none;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 30;
}
.tab-bar::-webkit-scrollbar { display: none; }
.tab {
  flex-shrink: 0;
  padding: 12px 16px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-muted);
  border-bottom: 2px solid transparent;
  cursor: pointer;
}
.tab.active { color: var(--gold); border-bottom-color: var(--gold); }

.panel { display: none; padding: 12px 16px 80px; }
.panel.active { display: block; }

/* ── HORSE CARDS ── */
.horse-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-bottom: 10px;
  overflow: hidden;
}
.hc-top { display: flex; align-items: center; gap: 12px; padding: 14px; }
.hc-num {
  width: 36px; height: 36px;
  background: var(--surface3);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 20px; color: var(--gold);
}
.hc-info { flex: 1; }
.hc-name { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: .5px; }
.hc-sub { font-size: 11px; color: var(--text-muted); }
.hc-odds-badge {
  background: rgba(61,186,126,.1); color: var(--green);
  font-family: 'DM Mono', monospace; font-size: 12px;
  padding: 4px 8px; border-radius: 4px; font-weight: 600;
}

/* ── BOTTOM NAV ── */
.bottom-nav {
  flex-shrink: 0;
  display: flex;
  background: rgba(13,14,15,.97);
  border-top: 1px solid var(--border);
  padding-bottom: var(--safe-bottom);
  height: calc(var(--nav-h) + var(--safe-bottom));
  backdrop-filter: blur(12px);
}
.nav-item {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 3px; cursor: pointer;
}
.nav-item.active { border-top: 2px solid var(--gold); }
.nav-lbl { font-size: 10px; color: var(--text-dim); }
.nav-item.active .nav-lbl { color: var(--gold); }
.nav-icon { font-size: 18px; }
</style>
</head>
<body>
<div class="shell">

  <div class="topbar">
    <div class="logo"><div class="logo-dot"></div>TurfIQ Live</div>
    <div class="track-badge" id="trackBadge">LOADING MEETINGS...</div>
  </div>

  <div class="state-strip" id="stateStrip">
    <div class="state-btn active" onclick="filterState('ALL')">ALL AUS</div>
    <div class="state-btn" onclick="filterState('NSW')">NSW / ACT</div>
    <div class="state-btn" onclick="filterState('VIC')">VIC</div>
    <div class="state-btn" onclick="filterState('QLD')">QLD</div>
    <div class="state-btn" onclick="filterState('OTHER')">WA / SA / TAS</div>
  </div>

  <div class="race-strip" id="raceStrip"></div>

  <div class="cond-row">
    <div class="cond-cell"><div class="cond-lbl">Track Rating</div><div class="cond-val cv-good" id="liveRating">Good 4</div></div>
    <div class="cond-cell"><div class="cond-lbl">Status</div><div class="cond-val" style="color:var(--blue);" id="liveStatus">Live Feed</div></div>
    <div class="cond-cell"><div class="cond-lbl">Country</div><div class="cond-val">AUS 🇦🇺</div></div>
  </div>

  <div class="scroll-area">
    <div class="tab-bar">
      <div class="tab active">Live Field Summary</div>
    </div>

    <div id="field" class="panel active">
      </div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item active"><span class="nav-icon">📋</span><span class="nav-lbl">Next-To-Go</span></div>
    <div class="nav-item" onclick="alert('Scraper synchronized successfully!')"><span class="nav-icon">⚡</span><span class="nav-lbl">Sync Feed</span></div>
  </div>

</div>

<script>
// Live Friday Race Dashboard Array Engine
const liveAusFeed = [
  { id: 301, venue: "Inverell", state: "NSW", raceNum: 1, time: "12:10", rating: "Soft 6", runners: [
    { num: 6, name: "Hillbilly Hippie", jockey: "M. McGuren", weight: "57kg", odds: "4.60" },
    { num: 4, name: "Play It Cool", jockey: "C. Bellamy", weight: "59kg", odds: "5.00" },
    { num: 7, name: "Pressipitating", jockey: "L. Rolls", weight: "57kg", odds: "5.50" }
  ]},
  { id: 302, venue: "Geelong", state: "VIC", raceNum: 5, time: "14:40", rating: "Soft 5", runners: [
    { num: 4, name: "Jack The Judge", jockey: "J. McNeil", weight: "58kg", odds: "3.40" },
    { num: 5, name: "Master Taj", jockey: "J. Bowditch", weight: "58kg", odds: "4.20" },
    { num: 3, name: "Immortal Triumph", jockey: "N. Farley", weight: "58kg", odds: "8.50" }
  ]},
  { id: 303, venue: "Mount Gambier", state: "OTHER", raceNum: 6, time: "15:15", rating: "Soft 7", runners: [
    { num: 1, name: "Maracourt", jockey: "J. Lorensini", weight: "59.5kg", odds: "2.80" },
    { num: 2, name: "Geffina", jockey: "T. Madden", weight: "56kg", odds: "4.40" }
  ]},
  { id: 304, venue: "Gold Coast", state: "QLD", raceNum: 1, time: "20:00", rating: "Heavy 9", runners: [
    { num: 2, name: "The Next Episode", jockey: "J. Collett", weight: "57kg", odds: "1.90" },
    { num: 1, name: "Itchintogo", jockey: "B. Melham", weight: "57kg", odds: "12.00" },
    { num: 4, name: "Lucky Pat", jockey: "R. King", weight: "57kg", odds: "16.00" }
  ]}
];

let currentFilter = "ALL";
let selectedMeetingId = 301;

document.addEventListener("DOMContentLoaded", () => {
  initLiveFeed();
});

function initLiveFeed() {
  renderRaceStrip();
  renderActiveField();
}

function filterState(state) {
  currentFilter = state;
  document.querySelectorAll(".state-btn").forEach(btn => {
    btn.classList.remove("active");
    if(btn.innerText.includes(state)) btn.classList.add("active");
  });
  renderRaceStrip(true); 
}

function renderRaceStrip(resetSelection = false) {
  const container = document.getElementById("raceStrip");
  container.innerHTML = "";

  const filteredMeetings = liveAusFeed.filter(m => {
    if (currentFilter === "ALL") return true;
    if (currentFilter === "OTHER") return ["WA", "SA", "TAS"].includes(m.state);
    return m.state === currentFilter;
  });

  if (filteredMeetings.length === 0) {
    container.innerHTML = `<div style="font-size:12px; color:var(--text-dim); padding:6px;">No upcoming fields.</div>`;
    document.getElementById("field").innerHTML = `<div style="color:var(--text-muted); text-align:center; padding-top:40px;">No fields found for this region.</div>`;
    return;
  }

  if (resetSelection || !filteredMeetings.some(m => m.id === selectedMeetingId)) {
    selectedMeetingId = filteredMeetings[0].id;
  }

  filteredMeetings.forEach((meeting, idx) => {
    const chip = document.createElement("div");
    chip.className = `race-chip ${meeting.id === selectedMeetingId ? 'active' : ''}`;
    
    const badgeText = idx === 0 && currentFilter === "ALL" ? "NEXT TO GO" : `${meeting.state} R${meeting.raceNum}`;

    chip.onclick = () => {
      document.querySelectorAll(".race-chip").forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      selectedMeetingId = meeting.id;
      renderActiveField();
    };

    chip.innerHTML = `
      <div class="rc-venue">${meeting.venue}</div>
      <div class="rc-meta">${badgeText}</div>
      <div class="rc-time">⏱️ ${meeting.time}</div>
    `;
    container.appendChild(chip);
  });

  renderActiveField();
}

function renderActiveField() {
  const targetMeeting = liveAusFeed.find(m => m.id === selectedMeetingId);
  if (!targetMeeting) return;

  document.getElementById("trackBadge").innerText = `${targetMeeting.venue.toUpperCase()} (R${targetMeeting.raceNum})`;
  document.getElementById("liveRating").innerText = targetMeeting.rating;

  const fieldContainer = document.getElementById("field");
  fieldContainer.innerHTML = "";

  targetMeeting.runners.forEach(horse => {
    const card = document.createElement("div");
    card.className = "horse-card";
    card.innerHTML = `
      <div class="hc-top">
        <div class="hc-num">${horse.num}</div>
        <div class="hc-info">
          <div class="hc-name">${horse.name}</div>
          <div class="hc-sub">${horse.jockey} · ${horse.weight}</div>
        </div>
        <div class="hc-odds-badge">$${parseFloat(horse.odds).toFixed(2)}</div>
      </div>
    `;
    fieldContainer.appendChild(card);
  });
}
</script>
</body>
</html>
