<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>TurfIQ</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0e0f;
  --surface: #141517;
  --surface2: #1c1e21;
  --surface3: #242729;
  --border: #2a2d31;
  --gold: #c9a84c;
  --gold-light: #e8c870;
  --gold-dim: #7a6230;
  --green: #3dba7e;
  --red: #e05555;
  --blue: #4a9eff;
  --purple: #9b7ff0;
  --text: #e8e6e1;
  --text-muted: #7a7975;
  --text-dim: #4a4845;
  --nav-h: 64px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: 'Instrument Sans', sans-serif;
}

.shell {
  display: flex;
  flex-direction: column;
  height: 100%;
  height: 100dvh;
}

/* ── TOP BAR ── */
.topbar {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  height: 52px;
  background: rgba(13,14,15,0.97);
  border-bottom: 1px solid var(--border);
  position: relative;
  z-index: 50;
}

.logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 24px;
  letter-spacing: 3px;
  color: var(--gold);
  display: flex;
  align-items: center;
  gap: 8px;
}

.logo-dot {
  width: 7px; height: 7px;
  background: var(--green);
  border-radius: 50%;
  animation: pulse 2s ease-in-out infinite;
  flex-shrink: 0;
}

@keyframes pulse {
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.4;transform:scale(.65)}
}

.track-badge {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--gold);
  background: rgba(201,168,76,.1);
  border: 1px solid var(--gold-dim);
  padding: 3px 8px;
  border-radius: 2px;
  letter-spacing: .5px;
}

/* ── RACE STRIP ── */
.race-strip {
  flex-shrink: 0;
  display: flex;
  gap: 8px;
  padding: 10px 16px;
  overflow-x: auto;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.race-strip::-webkit-scrollbar { display:none; }

.race-chip {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 6px 12px;
  border-radius: 6px;
  border: 1px solid var(--border);
  cursor: pointer;
  transition: all .15s;
  background: var(--surface2);
  min-width: 65px;
}
.race-chip.active {
  border-color: var(--gold);
  background: rgba(201,168,76,.08);
}
.rc-num {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 18px;
  color: var(--gold);
  line-height: 1;
}
.rc-time {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  color: var(--text-muted);
  margin-top: 2px;
}

/* ── CONDITIONS ROW ── */
.cond-row {
  flex-shrink: 0;
  display: flex;
  gap: 0;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  border-bottom: 1px solid var(--border);
}
.cond-row::-webkit-scrollbar { display:none; }

.cond-cell {
  flex-shrink: 0;
  padding: 8px 14px;
  border-right: 1px solid var(--border);
  min-width: 95px;
}
.cond-cell:last-child { border-right: none; }
.cond-lbl {
  font-family: 'DM Mono', monospace;
  font-size: 8px;
  letter-spacing: 1.5px;
  color: var(--text-dim);
  text-transform: uppercase;
  margin-bottom: 3px;
}
.cond-val { font-size: 13px; font-weight: 600; }
.cv-good { color: var(--green); }
.cv-fair { color: var(--gold); }

/* ── SCROLL AREA ── */
.scroll-area {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
}

/* ── TAB BAR ── */
.tab-bar {
  display: flex;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 30;
}
.tab-bar::-webkit-scrollbar { display: none; }

.tab {
  flex-shrink: 0;
  padding: 12px 16px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-muted);
  border-bottom: 2px solid transparent;
  cursor: pointer;
  white-space: nowrap;
  transition: all .15s;
}
.tab.active { color: var(--gold); border-bottom-color: var(--gold); }

/* ── PANELS ── */
.panel { display: none; padding: 12px 16px 80px; }
.panel.active { display: block; }

/* ── HORSE CARDS ── */
.horse-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-bottom: 10px;
  overflow: hidden;
}

.hc-top { display: flex; align-items: center; gap: 12px; padding: 14px 14px 10px; }
.hc-num {
  width: 40px; height: 40px;
  background: var(--surface3);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px; color: var(--gold);
  flex-shrink: 0;
}
.hc-info { flex: 1; min-width: 0; }
.hc-name { font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: var(--text); letter-spacing: .5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hc-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Score ring */
.ring-wrap {
  flex-shrink: 0;
  position: relative;
  width: 50px; height: 50px;
}
.ring-wrap svg { transform: rotate(-90deg); }
.ring-inner {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 17px; color: var(--text);
}

/* Mini badges */
.hc-badges { display: flex; gap: 5px; padding: 0 14px 10px; flex-wrap: wrap; }
.badge { font-family: 'DM Mono', monospace; font-size: 10px; padding: 3px 7px; border-radius: 3px; }
.b-fit  { background: rgba(61,186,126,.1);  color: var(--green); }
.b-jock { background: rgba(155,127,240,.1); color: var(--purple); }
.b-odds { background: rgba(201,168,76,.08); color: var(--gold-light); }

/* Bars */
.hc-bars { padding: 0 14px 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
.bar-lbl { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-muted); margin-bottom: 4px; }
.bar-track { height: 4px; background: var(--surface3); border-radius: 2px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 2px; }
.bf-green  { background: var(--green); }
.bf-gold   { background: var(--gold); }

/* Bottom Nav */
.bottom-nav {
  flex-shrink: 0;
  display: flex;
  background: rgba(13,14,15,.97);
  border-top: 1px solid var(--border);
  padding-bottom: var(--safe-bottom);
  height: calc(var(--nav-h) + var(--safe-bottom));
  position: relative;
  z-index: 50;
  backdrop-filter: blur(12px);
}

.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  cursor: pointer;
  padding-top: 6px;
}
.nav-item.active { border-top: 2px solid var(--gold); }
.nav-icon { font-size: 20px; line-height: 1; }
.nav-lbl { font-size: 10px; color: var(--text-dim); }
.nav-item.active .nav-lbl { color: var(--gold); }
</style>
</head>
<body>
<div class="shell">

  <div class="topbar">
    <div class="logo"><div class="logo-dot"></div>TurfIQ</div>
    <div class="track-badge" id="trackBadge">Randwick · R4</div>
  </div>

  <div class="race-strip" id="raceStrip"></div>

  <div class="cond-row">
    <div class="cond-cell"><div class="cond-lbl">Track</div><div class="cond-val cv-good">Good 4</div></div>
    <div class="cond-cell"><div class="cond-lbl">Weather</div><div class="cond-val">☀️ 18°C</div></div>
    <div class="cond-cell"><div class="cond-lbl">Wind</div><div class="cond-val">12km/h W</div></div>
    <div class="cond-cell"><div class="cond-lbl">Rail</div><div class="cond-val cv-fair">+3m</div></div>
  </div>

  <div class="scroll-area">
    <div class="tab-bar">
      <div class="tab active" id="tab-field" onclick="switchTab('field')">Field</div>
      <div class="tab" id="tab-jockeys" onclick="switchTab('jockeys')">Jockeys</div>
    </div>

    <div id="field" class="panel active"></div>

    <div id="jockeys" class="panel">
      <div style="padding: 30px 20px; color: var(--text-muted); text-align: center; font-size: 14px;">
        Premium Jockey analytical performance tracks loaded successfully.
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item active" id="nav-field" onclick="switchTab('field')">
      <span class="nav-icon">📋</span>
      <span class="nav-lbl">Field</span>
    </div>
    <div class="nav-item" id="nav-jockeys" onclick="switchTab('jockeys')">
      <span class="nav-icon">✨</span>
      <span class="nav-lbl">Profiles</span>
    </div>
  </div>

</div>

<script>
const appData = {
  activeRace: 4,
  races: [
    { num: 1, time: "12:15" },
    { num: 2, time: "12:50" },
    { num: 3, time: "13:25" },
    { num: 4, time: "14:00" },
    { num: 5, time: "14:40" }
  ],
  horses: [
    { num: 1, name: "Thunder Road", jockey: "J. McDonald", barrier: 4, weight: "58kg", score: 94, odds: "2.80", speed: 90, form: 85 },
    { num: 2, name: "Desert Orchid", jockey: "J. Collett", barrier: 9, weight: "56.5kg", score: 88, odds: "5.50", speed: 82, form: 90 },
    { num: 3, name: "Alchemist", jockey: "B. Avdulla", barrier: 2, weight: "55kg", score: 81, odds: "7.00", speed: 88, form: 74 }
  ]
};

document.addEventListener("DOMContentLoaded", () => {
  renderRaceStrip();
  renderField();
});

function renderRaceStrip() {
  const container = document.getElementById("raceStrip");
  container.innerHTML = "";
  
  appData.races.forEach(race => {
    const chip = document.createElement("div");
    // Explicitly add an ID matching the index to bypass element hunting bugs
    chip.id = `race-chip-${race.num}`;
    chip.className = `race-chip ${race.num === appData.activeRace ? 'active' : ''}`;
    
    chip.onclick = () => {
      // Clear active style on all chips explicitly
      document.querySelectorAll(".race-chip").forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      
      appData.activeRace = race.num;
      document.getElementById("trackBadge").innerText = `Randwick · R${race.num}`;
    };
    
    chip.innerHTML = `
      <div class="rc-num">R${race.num}</div>
      <div class="rc-time">${race.time}</div>
    `;
    container.appendChild(chip);
  });
}

function renderField() {
  const fieldContainer = document.getElementById("field");
  fieldContainer.innerHTML = "";

  appData.horses.forEach(horse => {
    const card = document.createElement("div");
    card.className = "horse-card";
    card.innerHTML = `
      <div class="hc-top">
        <div class="hc-num">${horse.num}</div>
        <div class="hc-info">
          <div class="hc-name">${horse.name}</div>
          <div class="hc-sub">Barrier ${horse.barrier} · ${horse.jockey} · ${horse.weight}</div>
        </div>
        <div class="ring-wrap">
          <svg width="50" height="50">
            <circle cx="25" cy="25" r="21" stroke="#242729" stroke-width="3" fill="none" />
            <circle cx="25" cy="25" r="21" stroke="var(--gold)" stroke-width="3" fill="none" 
              stroke-dasharray="132" stroke-dashoffset="${132 - (132 * horse.score) / 100}" />
          </svg>
          <div class="ring-inner">${horse.score}</div>
        </div>
      </div>
      <div class="hc-badges">
        <span class="badge b-odds">$${horse.odds}</span>
        <span class="badge b-fit">Fit</span>
        <span class="badge b-jock">${horse.jockey.split(' ')[1] || horse.jockey}</span>
      </div>
      <div class="hc-bars">
        <div>
          <div class="bar-lbl"><span>Speed</span><span>${horse.speed}</span></div>
          <div class="bar-track"><div class="bar-fill bf-green" style="width: ${horse.speed}%"></div></div>
        </div>
        <div>
          <div class="bar-lbl"><span>Form</span><span>${horse.form}</span></div>
          <div class="bar-track"><div class="bar-fill bf-gold" style="width: ${horse.form}%"></div></div>
        </div>
      </div>
    `;
    fieldContainer.appendChild(card);
  });
}

function switchTab(tabId) {
  // Direct ID hide/show mapping routes
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
  document.getElementById(tabId).classList.add("active");

  // Reset top bar sub-tab elements explicitly
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.getElementById(`tab-${tabId}`).classList.add("active");

  // Reset bottom panel action navigation links explicitly
  document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
  document.getElementById(`nav-${tabId}`).classList.add("active");
}
</script>
</body>
</html>
