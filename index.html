<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>TurfIQ</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0e0f;
  --surface: #141517;
  --surface2: #1c1e21;
  --surface3: #242729;
  --border: #2a2d31;
  --gold: #c9a84c;
  --gold-light: #e8c870;
  --gold-dim: #7a6230;
  --green: #3dba7e;
  --red: #e05555;
  --blue: #4a9eff;
  --purple: #9b7ff0;
  --text: #e8e6e1;
  --text-muted: #7a7975;
  --text-dim: #4a4845;
  --nav-h: 64px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: 'Instrument Sans', sans-serif;
}

.shell {
  display: flex;
  flex-direction: column;
  height: 100%;
  height: 100dvh;
}

/* ── TOP BAR ── */
.topbar {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  height: 52px;
  background: rgba(13,14,15,0.97);
  border-bottom: 1px solid var(--border);
  position: relative;
  z-index: 50;
}

.logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 24px;
  letter-spacing: 3px;
  color: var(--gold);
  display: flex;
  align-items: center;
  gap: 8px;
}

.logo-dot {
  width: 7px; height: 7px;
  background: var(--green);
  border-radius: 50%;
  animation: pulse 2s ease-in-out infinite;
  flex-shrink: 0;
}

@keyframes pulse {
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.4;transform:scale(.65)}
}

.track-badge {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--gold);
  background: rgba(201,168,76,.1);
  border: 1px solid var(--gold-dim);
  padding: 3px 8px;
  border-radius: 2px;
}

/* ── RACE STRIP ── */
.race-strip {
  flex-shrink: 0;
  display: flex;
  gap: 8px;
  padding: 10px 16px;
  overflow-x: auto;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.race-strip::-webkit-scrollbar { display:none; }

.race-chip {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 6px 12px;
  border-radius: 6px;
  border: 1px solid var(--border);
  cursor: pointer;
  background: var(--surface2);
  min-width: 65px;
}
.race-chip.active {
  border-color: var(--gold);
  background: rgba(201,168,76,.08);
}
.rc-num {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 18px;
  color: var(--gold);
  line-height: 1;
}
.rc-time {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  color: var(--text-muted);
  margin-top: 2px;
}

/* ── CONDITIONS ROW ── */
.cond-row {
  flex-shrink: 0;
  display: flex;
  gap: 0;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  border-bottom: 1px solid var(--border);
}
.cond-row::-webkit-scrollbar { display:none; }

.cond-cell {
  flex-shrink: 0;
  padding: 8px 14px;
  border-right: 1px solid var(--border);
  min-width: 95px;
}
.cond-cell:last-child { border-right: none; }
.cond-lbl {
  font-family: 'DM Mono', monospace;
  font-size: 8px;
  color: var(--text-dim);
  text-transform: uppercase;
  margin-bottom: 3px;
}
.cond-val { font-size: 13px; font-weight: 600; }
.cv-good { color: var(--green); }

/* ── SCROLL AREA ── */
.scroll-area {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.tab-bar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  font-size: 13px;
  font-weight: 600;
  color: var(--gold);
  font-family: 'DM Mono', monospace;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.panel { padding: 12px 16px 80px; }

/* ── HORSE CARDS ── */
.horse-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-bottom: 10px;
  overflow: hidden;
}

.hc-top { display: flex; align-items: center; gap: 12px; padding: 14px; }
.hc-num {
  width: 36px; height: 36px;
  background: var(--surface3);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 20px; color: var(--gold);
  flex-shrink: 0;
}
.hc-info { flex: 1; min-width: 0; }
.hc-name { font-family: 'Bebas Neue', sans-serif; font-size: 21px; color: var(--text); letter-spacing: .5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hc-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.hc-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
  flex-shrink: 0;
}
.hc-odds {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  color: var(--text-muted);
}
.hc-pct-badge {
  background: rgba(61,186,126,.1);
  color: var(--green);
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  font-weight: 600;
  padding: 4px 8px;
  border-radius: 4px;
  border: 1px solid rgba(61,186,126,.15);
}

/* ── BOTTOM NAV ── */
.bottom-nav {
  flex-shrink: 0;
  display: flex;
  background: rgba(13,14,15,.97);
  border-top: 1px solid var(--border);
  padding-bottom: var(--safe-bottom);
  height: calc(var(--nav-h) + var(--safe-bottom));
  backdrop-filter: blur(12px);
}

.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  color: var(--gold);
}
.nav-icon { font-size: 20px; }
.nav-lbl { font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
</style>
</head>
<body>
<div class="shell">

  <div class="topbar">
    <div class="logo"><div class="logo-dot"></div>TurfIQ</div>
    <div class="track-badge" id="trackBadge">LOADING...</div>
  </div>

  <div class="race-strip" id="raceStrip"></div>

  <div class="cond-row">
    <div class="cond-cell"><div class="cond-lbl">Track</div><div class="cond-val cv-good">Good 4</div></div>
    <div class="cond-cell"><div class="cond-lbl">Weather</div><div class="cond-val">☀️ 18°C</div></div>
    <div class="cond-cell"><div class="cond-lbl">Wind</div><div class="cond-val">12km/h W</div></div>
    <div class="cond-cell"><div class="cond-lbl">Model</div><div class="cond-val" style="color: var(--blue);">Normalized</div></div>
  </div>

  <div class="scroll-area">
    <div class="tab-bar">Live Field Summary</div>
    <div id="field" class="panel active"></div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item">
      <span class="nav-icon">📋</span>
      <span class="nav-lbl">Dynamic Field</span>
    </div>
  </div>

</div>

<script>
// Multidimensional Race Database Array Framework
const appData = {
  activeRaceId: 104,
  races: [
    { id: 101, num: 1, venue: "Randwick", time: "12:15", runners: [
      { num: 1, name: "Alpha Flight", jockey: "B. Shinn", barrier: 2, weight: "59kg", odds: 2.20 },
      { num: 2, name: "Storm Boy", jockey: "J. McDonald", barrier: 5, weight: "56.5kg", odds: 3.50 },
      { num: 3, name: "Red Resistance", jockey: "T. Clark", barrier: 1, weight: "56kg", odds: 4.80 }
    ]},
    { id: 102, num: 2, venue: "Randwick", time: "12:50", runners: [
      { num: 1, name: "Fangirl", jockey: "J. McDonald", barrier: 4, weight: "57kg", odds: 1.80 },
      { num: 2, name: "Mililitia", jockey: "C. Williams", barrier: 3, weight: "55kg", odds: 5.50 },
      { num: 3, name: "Hindquarter", jockey: "N. Rawiller", barrier: 7, weight: "59kg", odds: 9.00 },
      { num: 4, name: "Zardozi", jockey: "Z. Purton", barrier: 1, weight: "54.5kg", odds: 12.00 }
    ]},
    { id: 103, num: 3, venue: "Randwick", time: "13:25", runners: [
      { num: 1, name: "Think About It", jockey: "S. Clipperton", barrier: 3, weight: "58.5kg", odds: 2.05 },
      { num: 2, name: "Hawaii Five O", jockey: "N. Rawiller", barrier: 6, weight: "58.5kg", odds: 4.20 },
      { num: 3, name: "Bella Nipotina", jockey: "C. Williams", barrier: 2, weight: "56.5kg", odds: 6.50 }
    ]},
    { id: 104, num: 4, venue: "Randwick", time: "14:00", runners: [
      { num: 1, name: "Thunder Road", jockey: "J. McDonald", barrier: 4, weight: "58kg", odds: 2.80 },
      { num: 2, name: "Desert Orchid", jockey: "J. Collett", barrier: 9, weight: "56.5kg", odds: 5.50 },
      { num: 3, name: "Alchemist", jockey: "B. Avdulla", barrier: 2, weight: "55kg", odds: 7.00 },
      { num: 4, name: "Velvet Steel", jockey: "T. Berry", barrier: 6, weight: "54kg", odds: 11.00 }
    ]},
    { id: 105, num: 5, venue: "Randwick", time: "14:40", runners: [
      { num: 1, name: "Imperatriz", jockey: "O. Bosson", barrier: 4, weight: "56.5kg", odds: 1.65 },
      { num: 2, name: "Private Eye", jockey: "N. Rawiller", barrier: 1, weight: "58.5kg", odds: 4.60 },
      { num: 3, name: "Buenos Noches", jockey: "D. Gibbons", barrier: 8, weight: "58.5kg", odds: 13.00 }
    ]}
  ]
};

document.addEventListener("DOMContentLoaded", () => {
  renderRaceStrip();
  updateView();
});

function renderRaceStrip() {
  const container = document.getElementById("raceStrip");
  container.innerHTML = "";
  
  appData.races.forEach(race => {
    const chip = document.createElement("div");
    chip.className = `race-chip ${race.id === appData.activeRaceId ? 'active' : ''}`;
    
    // Modern Event Listening API handles tap routing execution flawlessly on mobile browsers
    chip.addEventListener("click", () => {
      document.querySelectorAll(".race-chip").forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      appData.activeRaceId = race.id;
      updateView();
    });
    
    chip.innerHTML = `
      <div class="rc-num">R${race.num}</div>
      <div class="rc-time">${race.time}</div>
    `;
    container.appendChild(chip);
  });
}

function updateView() {
  const activeRace = appData.races.find(r => r.id === appData.activeRaceId);
  if (!activeRace) return;

  // Sync Header Status Text line elements
  document.getElementById("trackBadge").innerText = `${activeRace.venue} · Race ${activeRace.num}`;

  const fieldContainer = document.getElementById("field");
  fieldContainer.innerHTML = "";

  // Step 1: Parse and store individual baseline market probability vectors (1 / odds)
  const structuralProbabilities = activeRace.runners.map(horse => {
    const rawOdds = parseFloat(horse.odds) || 10;
    return {
      ...horse,
      rawProbValue: (1 / rawOdds) * 100
    };
  });

  // Step 2: Sum the field lines to pinpoint total bookmaker margin weights
  const totalMarginWeight = structuralProbabilities.reduce((sum, h) => sum + h.rawProbValue, 0);

  // Step 3: Run normalization distribution loop so final outputs sum cleanly to exactly 100%
  structuralProbabilities.forEach(horse => {
    const cleanWinPercentage = ((horse.rawProbValue / totalMarginWeight) * 100).toFixed(1);
    
    const card = document.createElement("div");
    card.className = "horse-card";
    card.innerHTML = `
      <div class="hc-top">
        <div class="hc-num">${horse.num}</div>
        <div class="hc-info">
          <div class="hc-name">${horse.name}</div>
          <div class="hc-sub">Barrier ${horse.barrier} · ${horse.jockey} (${horse.weight})</div>
        </div>
        <div class="hc-right">
          <div class="hc-odds">$${parseFloat(horse.odds).toFixed(2)}</div>
          <div class="hc-pct-badge">${cleanWinPercentage}% Win</div>
        </div>
      </div>
    `;
    fieldContainer.appendChild(card);
  });
}
</script>
</body>
</html>
