<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>TurfIQ Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0e0f;
  --surface: #141517;
  --surface2: #1c1e21;
  --surface3: #242729;
  --border: #2a2d31;
  --gold: #c9a84c;
  --gold-light: #e8c870;
  --gold-dim: #7a6230;
  --green: #3dba7e;
  --red: #e05555;
  --red-dim: rgba(224, 85, 85, 0.12);
  --blue: #4a9eff;
  --purple: #9b7ff0;
  --text: #e8e6e1;
  --text-muted: #7a7975;
  --text-dim: #4a4845;
  --nav-h: 64px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: 'Instrument Sans', sans-serif;
}

.shell {
  display: flex;
  flex-direction: column;
  height: 100%;
  height: 100dvh;
}

/* ── TOP BAR ── */
.topbar {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  height: 52px;
  background: rgba(13,14,15,0.97);
  border-bottom: 1px solid var(--border);
  position: relative;
  z-index: 50;
}

.logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 24px;
  letter-spacing: 3px;
  color: var(--gold);
  display: flex;
  align-items: center;
  gap: 8px;
}

.logo-dot {
  width: 7px; height: 7px;
  background: var(--green);
  border-radius: 50%;
  animation: pulse 2s ease-in-out infinite;
  flex-shrink: 0;
}

@keyframes pulse {
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.4;transform:scale(.65)}
}

.track-badge {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--gold);
  background: rgba(201,168,76,.1);
  border: 1px solid var(--gold-dim);
  padding: 3px 8px;
  border-radius: 2px;
}

/* ── HORIZONTALLY SCROLLABLE TIMELINE STRIP ── */
.race-strip {
  flex-shrink: 0;
  display: flex;
  gap: 10px;
  padding: 12px 16px;
  overflow-x: auto;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.race-strip::-webkit-scrollbar { display:none; }

.race-chip {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 8px 12px;
  border-radius: 6px;
  border: 1px solid var(--border);
  cursor: pointer;
  background: var(--surface2);
  min-width: 125px;
}
.race-chip.active {
  border-color: var(--gold);
  background: rgba(201,168,76,.08);
}
.rc-venue {
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
}
.rc-time {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--gold);
  margin-top: 4px;
}

/* ── CONDITIONS ROW ── */
.cond-row {
  flex-shrink: 0;
  display: flex;
  overflow-x: auto;
  scrollbar-width: none;
  border-bottom: 1px solid var(--border);
}
.cond-row::-webkit-scrollbar { display:none; }
.cond-cell {
  flex-shrink: 0;
  padding: 8px 14px;
  border-right: 1px solid var(--border);
  min-width: 95px;
}
.cond-lbl {
  font-family: 'DM Mono', monospace;
  font-size: 8px;
  color: var(--text-dim);
  text-transform: uppercase;
}
.cond-val { font-size: 13px; font-weight: 600; margin-top: 1px;}
.cv-good { color: var(--green); }

/* ── SCROLL AREA ── */
.scroll-area {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.tab-bar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  font-family: 'DM Mono', monospace;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.panel { padding: 12px 16px 120px; }

/* ── HORSE CARDS ── */
.horse-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-bottom: 10px;
  overflow: hidden;
}
.horse-card.scratched-mode {
  border-color: rgba(224, 85, 85, 0.25);
  background: rgba(224, 85, 85, 0.01);
}

.hc-top { display: flex; align-items: center; gap: 12px; padding: 14px; }
.hc-num {
  width: 36px; height: 36px;
  background: var(--surface3);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 20px; color: var(--gold);
  flex-shrink: 0;
}
.scratched-mode .hc-num {
  background: rgba(224, 85, 85, 0.1);
  color: var(--red);
}

.hc-info { flex: 1; min-width: 0; }
.hc-name { font-family: 'Bebas Neue', sans-serif; font-size: 21px; color: var(--text); letter-spacing: .5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scratched-mode .hc-name { color: var(--red); text-decoration: line-through; opacity: 0.5; }
.hc-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.hc-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
  flex-shrink: 0;
}
.hc-odds {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  color: var(--text-muted);
}
.hc-pct-badge {
  background: rgba(201,168,76,.12); color: var(--gold-light);
  font-family: 'DM Mono', monospace; font-size: 13px;
  padding: 4px 8px; border-radius: 4px; font-weight: 600;
  border: 1px solid rgba(201,168,76,.2);
}
.hc-prob-high {
  background: rgba(61,186,126,.12); color: var(--green);
  border-color: rgba(61,186,126,.2);
}
.hc-prob-scratch {
  background: var(--red-dim); color: var(--red);
  border-color: rgba(224, 85, 85, 0.2);
}

/* ── BOTTOM NAV ── */
.bottom-nav {
  flex-shrink: 0;
  display: flex;
  background: rgba(13,14,15,.97);
  border-top: 1px solid var(--border);
  padding-bottom: var(--safe-bottom);
  height: calc(var(--nav-h) + var(--safe-bottom));
  backdrop-filter: blur(12px);
}

.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  color: var(--gold);
}
.nav-icon { font-size: 20px; }
.nav-lbl { font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
</style>
</head>
<body>
<div class="shell">

  <div class="topbar">
    <div class="logo"><div class="logo-dot"></div>TurfIQ Pro</div>
    <div class="track-badge" id="trackBadge">LOADING DASHBOARD...</div>
  </div>

  <div class="race-strip" id="raceStrip"></div>

  <div class="cond-row">
    <div class="cond-cell"><div class="cond-lbl">Track Surface</div><div class="cond-val cv-good" id="liveRating">Dynamic</div></div>
    <div class="cond-cell"><div class="cond-lbl">Scratchings</div><div class="cond-val" style="color:var(--red);">Retained (0%)</div></div>
    <div class="cond-cell"><div class="cond-lbl">Engine Mode</div><div class="cond-val" style="color:var(--blue);">Normalized</div></div>
  </div>

  <div class="scroll-area">
    <div class="tab-bar">Predictive Win-Chance Distribution</div>
    <div id="field" class="panel active"></div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item">
      <span class="nav-icon">📋</span>
      <span class="nav-lbl">Time Ordered</span>
    </div>
  </div>

</div>

<script>
// Complete Dynamic Multi-Track Australian Racing Database Object
const liveAusFeed = [
  { id: 901, venue: "Inverell", state: "NSW", raceNum: 1, name: "Maiden Plate", time: "12:10", rating: "Soft 6", runners: [
    { num: 1, name: "More Than A Star", jockey: "Ben Looker", trainer: "Brett Cavanough", weight: "59kg", odds: 2.15, scratched: false },
    { num: 2, name: "Hillbilly Hippie", jockey: "M. McGuren", trainer: "C. Stables", weight: "57kg", odds: 4.60, scratched: false },
    { num: 3, name: "Play It Cool", jockey: "C. Bellamy", trainer: "M. Wilson", weight: "59kg", odds: 5.50, scratched: false },
    { num: 4, name: "Pressipitating", jockey: "L. Rolls", trainer: "B. Hayes", weight: "57kg", odds: 6.50, scratched: false },
    { num: 5, name: "Noble Missile", jockey: "Raymond Spokes", trainer: "J. Smerdon", weight: "59kg", odds: 9.00, scratched: false },
    { num: 6, name: "Northern Invader", jockey: "D. Peisley", trainer: "E. Ensby", weight: "59kg", odds: 15.00, scratched: false },
    { num: 11, name: "Outback Bandit", jockey: "None", trainer: "T. Gollan", weight: "55kg", odds: 0, scratched: true }
  ]},
  { id: 902, venue: "Geelong", state: "VIC", raceNum: 1, name: "3Y Maiden Plate", time: "12:20", rating: "Soft 7", runners: [
    { num: 1, name: "Circus Circus", jockey: "Zac Spain", trainer: "G. Eurell", weight: "58kg", odds: 2.90, scratched: false },
    { num: 2, name: "Forward Ho", jockey: "J. Allen", trainer: "W. Morrissey", weight: "58kg", odds: 5.00, scratched: false },
    { num: 3, name: "Jenni Poppins", jockey: "N. Farley", trainer: "C. Maher", weight: "58kg", odds: 6.00, scratched: false },
    { num: 5, name: "Le Notre", jockey: "J. McNeil", trainer: "L. McGill", weight: "58kg", odds: 15.00, scratched: false },
    { num: 8, name: "Sparkling Award", jockey: "J. Bowditch", trainer: "G. Bedggood", weight: "58kg", odds: 15.00, scratched: false },
    { num: 4, name: "Karumba Girl", jockey: "W. Gordon", trainer: "L. Sullivan", weight: "58kg", odds: 41.00, scratched: false },
    { num: 9, name: "Waggish", jockey: "C. Newitt", trainer: "P. Kearney", weight: "56kg", odds: 61.00, scratched: false },
    { num: 6, name: "Miss Gossip Girl", jockey: "D. Bates", trainer: "A. Alexander", weight: "56kg", odds: 101.00, scratched: false },
    { num: 7, name: "Oh So Vein", jockey: "None", trainer: "C. Maher", weight: "56kg", odds: 301.00, scratched: false }
  ]},
  { id: 903, venue: "Pakenham", state: "VIC", raceNum: 1, name: "Ladbrokes Maiden", time: "16:45", rating: "Soft 7", runners: [
    { num: 1, name: "Geeseven", jockey: "Billy Egan", trainer: "Ciaron Maher", weight: "58kg", odds: 2.10, scratched: false },
    { num: 3, name: "Aradeo", jockey: "Zac Spain", trainer: "M. Price Stables", weight: "58kg", odds: 2.70, scratched: false },
    { num: 9, name: "Vespers", jockey: "Teo Nugent", trainer: "Ben Hayes", weight: "56kg", odds: 6.50, scratched: false },
    { num: 5, name: "Ivy Princess", jockey: "Ruby Lamont", trainer: "Paul Robl", weight: "56kg", odds: 14.00, scratched: false },
    { num: 2, name: "Let Lily Loose", jockey: "None", trainer: "Tony Gollan", weight: "56kg", odds: 0, scratched: true }
  ]}
];

let selectedMeetingId = 901;

document.addEventListener("DOMContentLoaded", () => {
  if (liveAusFeed.length > 0) {
    selectedMeetingId = liveAusFeed[0].id;
  }
  initLiveFeed();
});

function initLiveFeed() {
  renderRaceStrip();
  renderActiveField();
}

function renderRaceStrip() {
  const container = document.getElementById("raceStrip");
  if (!container) return;
  container.innerHTML = "";

  liveAusFeed.forEach((meeting) => {
    const chip = document.createElement("div");
    chip.className = `race-chip ${meeting.id === selectedMeetingId ? 'active' : ''}`;

    // Standard DOM Level 2 Event bindings bypass pre-paint string execution limits
    chip.addEventListener("click", () => {
      document.querySelectorAll(".race-chip").forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      selectedMeetingId = meeting.id;
      renderActiveField();
    });

    chip.innerHTML = `
      <div class="rc-venue">${meeting.venue} R${meeting.raceNum}</div>
      <div class="rc-time">⏱️ ${meeting.time}</div>
    `;
    container.appendChild(chip);
  });
}

function calculateWinProbabilities(runners) {
  if (!runners || !Array.isArray(runners)) return [];
  
  let activeRunners = runners.filter(r => r && !r.scratched);
  let scratchedRunners = runners.filter(r => r && r.scratched);

  if (activeRunners.length === 0) {
    return scratchedRunners.map(r => ({ ...r, finalProbability: "0.0" }));
  }

  // Derive base inverse percentages from fixed decimals
  let rawProbabilities = activeRunners.map(r => {
    let price = parseFloat(r.odds) || 10;
    return { ...r, baseProb: (1 / price) * 100 };
  });

  // Calculate strict market normalization margin pools
  let sumTotal = rawProbabilities.reduce((acc, curr) => acc + curr.baseProb, 0) || 1;
  
  let finalActive = rawProbabilities.map(r => ({
    ...r,
    finalProbability: ((r.baseProb / sumTotal) * 100).toFixed(1)
  })).sort((a, b) => parseFloat(b.finalProbability) - parseFloat(a.finalProbability));

  let finalScratched = scratchedRunners.map(r => ({ ...r, finalProbability: "0.0" }));

  return [...finalActive, ...finalScratched];
}

function renderActiveField() {
  const targetMeeting = liveAusFeed.find(m => m.id === selectedMeetingId);
  const fieldContainer = document.getElementById("field");
  if (!fieldContainer || !targetMeeting) return;

  // Render contextual status bars
  document.getElementById("trackBadge").innerText = `${targetMeeting.venue.toUpperCase()} · R${targetMeeting.raceNum}`;
  document.getElementById("liveRating").innerText = targetMeeting.rating || "Good 4";
  fieldContainer.innerHTML = "";

  const processedRunners = calculateWinProbabilities(targetMeeting.runners);

  processedRunners.forEach((horse, idx) => {
    const card = document.createElement("div");
    
    if (horse.scratched) {
      card.className = "horse-card scratched-mode";
      card.innerHTML = `
        <div class="hc-top">
          <div class="hc-num">✕</div>
          <div class="hc-info">
            <div class="hc-name">${horse.name}</div>
            <div class="hc-sub" style="color: var(--red); font-weight:600; letter-spacing:0.5px;">SCRATCHED</div>
            <div class="hc-sub">Stable: ${horse.trainer || 'Unknown'}</div>
          </div>
          <div class="hc-right">
            <div class="hc-odds" style="color:var(--text-dim); text-decoration:line-through;">$0.00</div>
            <div class="hc-prob-badge hc-prob-scratch">0.0%</div>
          </div>
        </div>
      `;
    } else {
      card.className = "horse-card";
      // Highlight the math-calculated top runner with custom styling classes
      const badgeClass = idx === 0 ? "hc-pct-badge hc-prob-high" : "hc-pct-badge";
      let displayOdds = parseFloat(horse.odds) ? `$${parseFloat(horse.odds).toFixed(2)}` : 'NTD';
      
      card.innerHTML = `
        <div class="hc-top">
          <div class="hc-num">${horse.num || '?'}</div>
          <div class="hc-info">
            <div class="hc-name">${horse.name}</div>
            <div class="hc-sub">T: ${horse.trainer || 'Unk'} · J: ${horse.jockey || 'Unk'} (${horse.weight || '56kg'})</div>
          </div>
          <div class="hc-right">
            <div class="hc-odds">${displayOdds}</div>
            <div class="${badgeClass}">${horse.finalProbability}%</div>
          </div>
        </div>
      `;
    }
    fieldContainer.appendChild(card);
  });
}
</script>
</body>
</html>
