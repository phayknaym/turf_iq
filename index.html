<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>TurfIQ Live Analytics</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0e0f;
  --surface: #141517;
  --surface2: #1c1e21;
  --surface3: #242729;
  --border: #2a2d31;
  --gold: #c9a84c;
  --gold-light: #e8c870;
  --gold-dim: #7a6230;
  --green: #3dba7e;
  --red: #e05555;
  --blue: #4a9eff;
  --purple: #9b7ff0;
  --text: #e8e6e1;
  --text-muted: #7a7975;
  --text-dim: #4a4845;
  --nav-h: 64px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: 'Instrument Sans', sans-serif;
}

.shell {
  display: flex;
  flex-direction: column;
  height: 100%;
  height: 100dvh;
}

/* ── TOP BAR ── */
.topbar {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  height: 52px;
  background: rgba(13,14,15,0.97);
  border-bottom: 1px solid var(--border);
  position: relative;
  z-index: 50;
}

.logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 24px;
  letter-spacing: 3px;
  color: var(--gold);
  display: flex;
  align-items: center;
  gap: 8px;
}

.logo-dot {
  width: 7px; height: 7px;
  background: var(--green);
  border-radius: 50%;
  animation: pulse 2s ease-in-out infinite;
  flex-shrink: 0;
}

@keyframes pulse {
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.4;transform:scale(.65)}
}

.track-badge {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--gold);
  background: rgba(201,168,76,.1);
  border: 1px solid var(--gold-dim);
  padding: 3px 8px;
  border-radius: 2px;
  letter-spacing: .5px;
}

/* ── STATE FILTER STRIP ── */
.state-strip {
  flex-shrink: 0;
  display: flex;
  gap: 6px;
  padding: 8px 16px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  scrollbar-width: none;
}
.state-strip::-webkit-scrollbar { display:none; }
.state-btn {
  padding: 6px 12px;
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text-muted);
  font-size: 11px;
  font-weight: 600;
  border-radius: 4px;
  cursor: pointer;
  white-space: nowrap;
}
.state-btn.active {
  background: var(--gold);
  color: #0d0e0f;
  border-color: var(--gold);
}

/* ── LIVE RACE STRIP ── */
.race-strip {
  flex-shrink: 0;
  display: flex;
  gap: 8px;
  padding: 10px 16px;
  overflow-x: auto;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  scrollbar-width: none;
}
.race-strip::-webkit-scrollbar { display:none; }

.race-chip {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 6px 10px;
  border-radius: 6px;
  border: 1px solid var(--border);
  cursor: pointer;
  background: var(--surface2);
  min-width: 95px;
}
.race-chip.active {
  border-color: var(--gold);
  background: rgba(201,168,76,.08);
}
.rc-venue {
  font-size: 11px;
  font-weight: 600;
  color: var(--text);
  max-width: 85px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.rc-meta {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  color: var(--gold);
  margin-top: 1px;
}
.rc-time {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--text-muted);
  margin-top: 3px;
}

/* ── CONDITIONS ROW ── */
.cond-row {
  flex-shrink: 0;
  display: flex;
  overflow-x: auto;
  scrollbar-width: none;
  border-bottom: 1px solid var(--border);
}
.cond-row::-webkit-scrollbar { display:none; }
.cond-cell {
  flex-shrink: 0;
  padding: 8px 14px;
  border-right: 1px solid var(--border);
  min-width: 95px;
}
.cond-lbl {
  font-family: 'DM Mono', monospace;
  font-size: 8px;
  color: var(--text-dim);
  text-transform: uppercase;
}
.cond-val { font-size: 13px; font-weight: 600; margin-top: 1px;}
.cv-good { color: var(--green); }

/* ── SCROLL AREA ── */
.scroll-area {
  flex: 1;
  overflow-y: auto;
}

/* ── TAB BAR ── */
.tab-bar {
  display: flex;
  overflow-x: auto;
  scrollbar-width: none;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 30;
}
.tab-bar::-webkit-scrollbar { display: none; }
.tab {
  flex-shrink: 0;
  padding: 12px 16px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-muted);
  border-bottom: 2px solid transparent;
  cursor: pointer;
}
.tab.active { color: var(--gold); border-bottom-color: var(--gold); }

.panel { display: none; padding: 12px 16px 80px; }
.panel.active { display: block; }

/* ── HORSE CARDS ── */
.horse-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-bottom: 10px;
  overflow: hidden;
}
.hc-top { display: flex; align-items: center; gap: 12px; padding: 14px; }
.hc-num {
  width: 36px; height: 36px;
  background: var(--surface3);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 20px; color: var(--gold);
}
.hc-info { flex: 1; min-width: 0; }
.hc-name { font-family: 'Bebas Neue', sans-serif; font-size: 21px; letter-spacing: .5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hc-sub { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.hc-metrics-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
.hc-odds { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text-muted); font-weight: 500; }
.hc-prob-badge {
  background: rgba(201,168,76,.12); color: var(--gold-light);
  font-family: 'DM Mono', monospace; font-size: 13px;
  padding: 4px 8px; border-radius: 4px; font-weight: 600;
  border: 1px solid rgba(201,168,76,.2);
}
.hc-prob-high {
  background: rgba(61,186,126,.12); color: var(--green);
  border-color: rgba(61,186,126,.2);
}

/* ── BOTTOM NAV ── */
.bottom-nav {
  flex-shrink: 0;
  display: flex;
  background: rgba(13,14,15,.97);
  border-top: 1px solid var(--border);
  padding-bottom: var(--safe-bottom);
  height: calc(var(--nav-h) + var(--safe-bottom));
  backdrop-filter: blur(12px);
}
.nav-item {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 3px; cursor: pointer;
}
.nav-item.active { border-top: 2px solid var(--gold); }
.nav-lbl { font-size: 10px; color: var(--text-dim); }
.nav-item.active .nav-lbl { color: var(--gold); }
.nav-icon { font-size: 18px; }
</style>
</head>
<body>
<div class="shell">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="logo"><div class="logo-dot"></div>TurfIQ Predictive</div>
    <div class="track-badge" id="trackBadge">CALCULATING PROBABILITIES...</div>
  </div>

  <!-- STATE SELECTION FILTER STRIP -->
  <div class="state-strip" id="stateStrip">
    <div class="state-btn active" onclick="filterState('ALL')">ALL AUS</div>
    <div class="state-btn" onclick="filterState('QLD')">QLD Night</div>
    <div class="state-btn" onclick="filterState('VIC')">VIC</div>
    <div class="state-btn" onclick="filterState('OTHER')">SA / Regional</div>
  </div>

  <!-- RACE CHIP STRIP (CHRONOLOGICAL NEXT TO GO) -->
  <div class="race-strip" id="raceStrip"></div>

  <!-- DYNAMIC TRACK CONDITIONS -->
  <div class="cond-row">
    <div class="cond-cell"><div class="cond-lbl">Track Rating</div><div class="cond-val cv-good" id="liveRating">Good 4</div></div>
    <div class="cond-cell"><div class="cond-lbl">Algo Weighting</div><div class="cond-val" style="color:var(--purple);">Track+Jock+Stab</div></div>
    <div class="cond-cell"><div class="cond-lbl">Feed Mode</div><div class="cond-val" style="color:var(--blue);">Predictive</div></div>
  </div>

  <!-- SCROLLABLE INTERFACE -->
  <div class="scroll-area">
    <div class="tab-bar">
      <div class="tab active">Field Win-Chance Assessment</div>
    </div>

    <div id="field" class="panel active">
      <!-- Dynamic Predictive Cards Rendered Here -->
    </div>
  </div>

  <!-- BOTTOM NAVIGATION BAR -->
  <div class="bottom-nav">
    <div class="nav-item active"><span class="nav-icon">📋</span><span class="nav-lbl">Next-To-Go</span></div>
    <div class="nav-item" onclick="alert('Predictive engine recalculation completed!')"><span class="nav-icon">⚡</span><span class="nav-lbl">Recalculate</span></div>
  </div>

</div>

<script>
// Real Live Dynamic Field Data mapping today's actual fields 
const liveAusFeed = [
  { id: 401, venue: "Gold Coast", state: "QLD", raceNum: 6, name: "Nat 2YO Classic", time: "20:00", rating: "Soft 6", runners: [
    { num: 2, name: "The Next Episode", jockey: "Jason Collett", trainer: "Ciaron Maher", weight: "57kg", odds: 2.10, wetTrackForm: "Elite" },
    { num: 1, name: "Itchintogo", jockey: "Ben Melham", trainer: "Tony Gollan", weight: "57kg", odds: 4.80, wetTrackForm: "Strong" },
    { num: 4, name: "Lucky Pat", jockey: "Rachel King", trainer: "Pat Webster", weight: "57kg", odds: 7.50, wetTrackForm: "Moderate" },
    { num: 3, name: "Marffiano", jockey: "Mark Zahra", trainer: "Ben & JD Hayes", weight: "57kg", odds: 9.00, wetTrackForm: "Strong" },
    { num: 5, name: "Rarotonga", jockey: "Tommy Berry", trainer: "Paul Shailer", weight: "57kg", odds: 14.00, wetTrackForm: "Unknown" }
  ]},
  { id: 402, venue: "Geelong", state: "VIC", raceNum: 5, name: "Torquay Cup", time: "14:40", rating: "Soft 7", runners: [
    { num: 4, name: "Jack The Judge", jockey: "J. McNeil", trainer: "Archie Alexander", weight: "58kg", odds: 3.40, wetTrackForm: "Strong" },
    { num: 5, name: "Master Taj", jockey: "J. Bowditch", trainer: "Aaron Purcell", weight: "58kg", odds: 4.20, wetTrackForm: "Elite" },
    { num: 3, name: "Immortal Triumph", jockey: "N. Farley", trainer: "Chris Calthorpe", weight: "58kg", odds: 8.50, wetTrackForm: "Poor" }
  ]},
  { id: 403, venue: "Mount Gambier", state: "OTHER", raceNum: 8, name: "Gold Cup", time: "15:15", rating: "Soft 7", runners: [
    { num: 3, name: "Maracourt", jockey: "J. Lorensini", trainer: "M. O'Donnell Stables", weight: "59.5kg", odds: 7.00, wetTrackForm: "Elite" },
    { num: 2, name: "Geffina", jockey: "Jacob Opperman", trainer: "Aaron Purcell", weight: "56kg", odds: 3.00, wetTrackForm: "Elite" },
    { num: 1, name: "Hard Leaf", jockey: "J. Hill", trainer: "V. Stables", weight: "57.5kg", odds: 4.00, wetTrackForm: "Strong" }
  ]}
];

let currentFilter = "ALL";
let selectedMeetingId = 401;

document.addEventListener("DOMContentLoaded", () => {
  initLiveFeed();
});

function initLiveFeed() {
  renderRaceStrip();
  renderActiveField();
}

function filterState(state) {
  currentFilter = state;
  document.querySelectorAll(".state-btn").forEach(btn => {
    btn.classList.remove("active");
    if(btn.innerText.includes(state)) btn.classList.add("active");
  });
  renderRaceStrip(true); 
}

function renderRaceStrip(resetSelection = false) {
  const container = document.getElementById("raceStrip");
  container.innerHTML = "";

  const filteredMeetings = liveAusFeed.filter(m => {
    if (currentFilter === "ALL") return true;
    if (currentFilter === "OTHER") return ["WA", "SA", "TAS", "OTHER"].includes(m.state);
    return m.state === currentFilter;
  });

  if (filteredMeetings.length === 0) {
    container.innerHTML = `<div style="font-size:12px; color:var(--text-dim); padding:6px;">No upcoming fields.</div>`;
    document.getElementById("field").innerHTML = `<div style="color:var(--text-muted); text-align:center; padding-top:40px;">No fields found for this selection.</div>`;
    return;
  }

  if (resetSelection || !filteredMeetings.some(m => m.id === selectedMeetingId)) {
    selectedMeetingId = filteredMeetings[0].id;
  }

  filteredMeetings.forEach((meeting, idx) => {
    const chip = document.createElement("div");
    chip.className = `race-chip ${meeting.id === selectedMeetingId ? 'active' : ''}`;
    
    const badgeText = idx === 0 && currentFilter === "ALL" ? "NEXT TO GO" : `${meeting.state} R${meeting.raceNum}`;

    chip.onclick = () => {
      document.querySelectorAll(".race-chip").forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      selectedMeetingId = meeting.id;
      renderActiveField();
    };

    chip.innerHTML = `
      <div class="rc-venue">${meeting.venue}</div>
      <div class="rc-meta">${badgeText}</div>
      <div class="rc-time">⏱️ ${meeting.time}</div>
    `;
    container.appendChild(chip);
  });

  renderActiveField();
}

// ── TURFIQ MATHEMATICAL ALGORITHMIC CALCULATION ENGINE ──
function calculateWinProbabilities(runners, trackRating) {
  // Step 1: Extract baseline implied probability from direct market odds layout (1 / odds)
  let rawProbabilities = runners.map(r => ({
    ...r,
    baseProb: (1 / parseFloat(r.odds)) * 100
  }));

  // Step 2: Layer algorithmic adjustments based on Track + Jockey + Stable configurations
  let adjustedRunners = rawProbabilities.map(r => {
    let scalarModifier = 0;

    // Condition Check A: Wet Track Specialist Premium (Soft/Heavy trackers)
    if (trackRating.includes("Soft") || trackRating.includes("Heavy")) {
      if (r.wetTrackForm === "Elite") scalarModifier += 4.5;
      if (r.wetTrackForm === "Strong") scalarModifier += 2.0;
      if (r.wetTrackForm === "Poor") scalarModifier -= 3.0;
    }

    // Condition Check B: Premium Jockey Booking Multipliers
    const eliteJockeys = ["Jason Collett", "Ben Melham", "Mark Zahra", "Jacob Opperman", "J. McNeil"];
    if (eliteJockeys.includes(r.jockey)) {
      scalarModifier += 2.5;
    }

    // Condition Check C: Tier-1 Stable Metrical Weights
    const eliteStables = ["Ciaron Maher", "Tony Gollan", "Ben & JD Hayes", "Aaron Purcell"];
    if (eliteStables.includes(r.trainer)) {
      scalarModifier += 2.0;
    }

    let rawScore = r.baseProb + scalarModifier;
    return { ...r, calculatedScore: Math.max(rawScore, 1.5) }; // Keep baseline floor above 1.5%
  });

  // Step 3: Math Normalization loop ensures all added values sum cleanly to exactly 100% 
  let sumTotal = adjustedRunners.reduce((acc, curr) => acc + curr.calculatedScore, 0);
  
  return adjustedRunners.map(r => ({
    ...r,
    finalProbability: ((r.calculatedScore / sumTotal) * 100).toFixed(1)
  })).sort((a, b) => b.finalProbability - a.finalProbability); // Descending sorting layout
}

function renderActiveField() {
  const targetMeeting = liveAusFeed.find(m => m.id === selectedMeetingId);
  if (!targetMeeting) return;

  document.getElementById("trackBadge").innerText = `${targetMeeting.venue.toUpperCase()} · R${targetMeeting.raceNum} · ${targetMeeting.name}`;
  document.getElementById("liveRating").innerText = targetMeeting.rating;

  const fieldContainer = document.getElementById("field");
  fieldContainer.innerHTML = "";

  // Process runners through logic execution engine
  const processedRunners = calculateWinProbabilities(targetMeeting.runners, targetMeeting.rating);

  processedRunners.forEach((horse, idx) => {
    const card = document.createElement("div");
    card.className = "horse-card";
    
    // Dynamically apply green highlight styling framework to the top mathematical selection
    const badgeClass = idx === 0 ? "hc-prob-badge hc-prob-high" : "hc-prob-badge";

    card.innerHTML = `
      <div class="hc-top">
        <div class="hc-num">${horse.num}</div>
        <div class="hc-info">
          <div class="hc-name">${horse.name}</div>
          <div class="hc-sub">T: ${horse.trainer} · J: ${horse.jockey} (${horse.weight})</div>
          <div class="hc-sub" style="color: var(--text-dim); font-size:10px;">Wet Track Factor: ${horse.wetTrackForm}</div>
        </div>
        <div class="hc-metrics-wrap">
          <div class="hc-odds">$${parseFloat(horse.odds).toFixed(2)}</div>
          <div class="${badgeClass}">${horse.finalProbability}% Chance</div>
        </div>
      </div>
    `;
    fieldContainer.appendChild(card);
  });
}
</script>
</body>
</html>
